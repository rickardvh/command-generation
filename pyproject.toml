[project]
name = "command-generation"
version = "0.2.8"
description = "Command generation package extracted from Agentic Workspace."
authors = [
    { name = "Rickard von Haugwitz", email = "rickardvh@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.26.0",
]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "agentic-workspace",
    "pytest",
    "ruff",
    "ty",
]

[tool.uv.sources]
agentic-workspace = { git = "https://github.com/rickardvh/agentic-workspace.git", branch = "master" }
